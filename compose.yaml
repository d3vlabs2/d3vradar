services:
  radar:
    build: .
    image: d3v-job-radar:2.8
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3740:8000"
    volumes:
      - radar-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  radar-data:
